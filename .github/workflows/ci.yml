name: CommerceGuard CI
on:
  push:
    branches: ["feature/**"]
  pull_request:
jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commerceguard
          POSTGRES_PASSWORD: ${{ github.sha }}
          POSTGRES_DB: commerceguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U commerceguard" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://commerceguard:${{ github.sha }}@localhost:5432/commerceguard
      JWT_SECRET: ${{ github.run_id }}-${{ github.sha }}
      DEMO_ADMIN_PASSWORD: ${{ github.sha }}
      TEST_INTEGRATION: '1'
      NODE_ENV: test
      CI: 'false'
      DEMO_RESET_TOKENS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build React storefront
        working-directory: ecommerce
        run: npm install --no-audit --no-fund && npm run build
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund
      - name: Seed disposable PostgreSQL
        working-directory: backend
        run: npm run migrate && npm run seed
      - name: Execute policy and API integration tests
        working-directory: backend
        run: npm test
      - name: Check backend dependencies
        working-directory: backend
        run: npm audit --omit=dev --audit-level=high
      - name: Install Chromium for browser QA
        working-directory: ecommerce
        run: npx playwright install --with-deps chromium
      - name: Run storefront and checkout browser QA
        working-directory: ecommerce
        run: npm run test:e2e
        env:
          NODE_ENV: development
          CI: 'false'
      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: commerceguard-browser-qa
          path: |
            ecommerce/test-results/
            ecommerce/playwright-report/
          if-no-files-found: ignore
